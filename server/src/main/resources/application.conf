ktor {
    deployment {
        host = "127.0.0.1"
        host = ${?KTOR_HOST}
        sslPort = 8443
        sslPort = ${?KTOR_SSL_PORT}
    }
    security {
        ssl {
            keyStore = ${?TLS_KEYSTORE_PATH}
            keyAlias = ${?TLS_KEY_ALIAS}
            keyStorePassword = ${?TLS_KEYSTORE_PASSWORD}
            privateKeyPassword = ${?TLS_PRIVATE_KEY_PASSWORD}
        }
    }
    application {
        modules = [ dev.securemessenger.server.ApplicationKt.module ]
    }
}
